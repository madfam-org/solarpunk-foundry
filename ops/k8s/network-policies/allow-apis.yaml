# =============================================================================
# ⚠️ HISTORICAL — DO NOT APPLY (banner added 2026-09-04).
# NetworkPolicies for MADFAM namespaces are GENERATED by the Enclii control
# plane from each service's own `enclii.yaml` `network:` block and are
# deliberately not committed to git. This file hand-writes policies into a
# namespace this repository does not own, which is the documented anti-pattern
# ("do not add app-specific NetworkPolicies"). Applying it would shadow the
# generated policy and can black-hole traffic.
# Retained only as a historical record, like ops/docker/ and infrastructure/.
# The owning repository's `enclii.yaml` is the place to change ingress rules.
# =============================================================================
# API Ingress Network Policies
# Allow external access to API endpoints
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-janua-api
  namespace: janua
spec:
  podSelector:
    matchLabels:
      app: janua-api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 4100
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-switchyard-api
  namespace: enclii
spec:
  podSelector:
    matchLabels:
      app: switchyard-api
  policyTypes:
    - Ingress
  ingress:
    # Allow Prometheus scraping from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - port: 4200
          protocol: TCP
    # Allow external access
    - ports:
        - port: 4200
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-switchyard-ui
  namespace: enclii
spec:
  podSelector:
    matchLabels:
      app: switchyard-ui
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 4201
          protocol: TCP
