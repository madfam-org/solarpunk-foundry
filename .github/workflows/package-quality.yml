name: Package Quality

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - ".github/workflows/package-quality.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - ".github/workflows/package-quality.yml"

permissions:
  contents: read

jobs:
  packages:
    # Runner arm. GitHub-hosted minutes are billing-blocked org-wide and free
    # only for public repositories (ADR-010), so `ubuntu-latest` is the correct
    # default while this repo is public -- which it permanently is, per the
    # 2026-09-04 owner ruling. The arm exists so the runner choice is a single
    # org-level variable rather than a hard pin: set `ARC_BOOTSTRAP_COMPLETE` to
    # `true` and every job here moves to the self-hosted pool with no edit.
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
