name: Package Quality

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - "scripts/check-package-scripts.mjs"
      - "scripts/check-package-scripts.test.mjs"
      - ".github/workflows/package-quality.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - "scripts/check-package-scripts.mjs"
      - "scripts/check-package-scripts.test.mjs"
      - ".github/workflows/package-quality.yml"

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      # Runs BEFORE the recursive steps below. `pnpm -r lint` and `pnpm -r test`
      # skip any package that does not define the script and still exit 0, so
      # without this step the two gates below can pass with almost no coverage.
      - name: Package script coverage guard self-test
        run: node --test scripts/check-package-scripts.test.mjs

      - name: Package script coverage
        run: node scripts/check-package-scripts.mjs

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
