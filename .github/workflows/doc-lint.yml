name: Documentation Lint

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - '.env.example'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - '.env.example'

jobs:
  doc-guard:
    name: DocGuard
    # Hard-pinned to GitHub-hosted runners (2026-09-23, coherence audit B-D04).
    # This repo is permanently public and this job runs on `pull_request`, so it
    # executes code from fork PRs; that code must never reach the private
    # self-hosted pool. Do not reintroduce the org-variable runner arm here.
    # Why: AGENTS.md "CI runners in a public repo".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run DocGuard
        uses: ./.github/actions/doc-guard
        with:
          doc-path: './docs'
          strict: false
          check-env-vars: true
          check-links: true
          check-terminology: true
