name: Public Hygiene

# The hygiene scan reads every tracked TEXT file, not a doc glob, so the path
# filter must not be narrower than the scan: a narrow filter under-triggers and
# a `.npmrc`, `.yml` or `.sh` change would skip the guard that exists to read it.
on:
  pull_request:
    paths:
      - '**'
  push:
    branches: [main]
    paths:
      - '**'

permissions:
  contents: read

jobs:
  public-hygiene:
    # Hard-pinned to GitHub-hosted runners (2026-09-23, coherence audit B-D04).
    # This repo is permanently public and this job runs on `pull_request`, so it
    # executes code from fork PRs; that code must never reach the private
    # self-hosted pool. Do not reintroduce the org-variable runner arm here.
    # Why: AGENTS.md "CI runners in a public repo".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Public hygiene guard self-test
        run: bash ./scripts/tests/test-public-hygiene.sh
      - name: Check public repository hygiene
        run: ./scripts/public-hygiene-check.sh
      - name: Boundary surface guard self-test
        run: bash ./scripts/tests/test-boundary-surfaces.sh
      - name: Check boundary checkpoints
        run: bash ./scripts/boundary-checkpoint-check.sh
