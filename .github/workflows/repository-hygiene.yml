name: Repository Hygiene

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  no-tracked-node-modules:
    name: No tracked node_modules
    # Runner arm. GitHub-hosted minutes are billing-blocked org-wide and free
    # only for public repositories (ADR-010), so `ubuntu-latest` is the correct
    # default while this repo is public -- which it permanently is, per the
    # 2026-09-04 owner ruling. The arm exists so the runner choice is a single
    # org-level variable rather than a hard pin: set `ARC_BOOTSTRAP_COMPLETE` to
    # `true` and every job here moves to the self-hosted pool with no edit.
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject tracked dependency installs
        shell: bash
        run: |
          set -euo pipefail

          tracked="$(git ls-files | grep -E '(^|/)node_modules/' || true)"

          if [[ -n "${tracked}" ]]; then
            echo "Tracked node_modules entries are not allowed."
            echo "They make reusable GitHub Actions brittle and platform-specific."
            echo
            echo "${tracked}"
            exit 1
          fi
