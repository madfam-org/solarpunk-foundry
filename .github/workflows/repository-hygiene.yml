name: Repository Hygiene

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  no-tracked-node-modules:
    name: No tracked node_modules
    # Hard-pinned to GitHub-hosted runners (2026-09-23, coherence audit B-D04).
    # This repo is permanently public and this job runs on `pull_request`, so it
    # executes code from fork PRs; that code must never reach the private
    # self-hosted pool. Do not reintroduce the org-variable runner arm here.
    # Why: AGENTS.md "CI runners in a public repo".
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Reject tracked dependency installs
        shell: bash
        run: |
          set -euo pipefail

          tracked="$(git ls-files | grep -E '(^|/)node_modules/' || true)"

          if [[ -n "${tracked}" ]]; then
            echo "Tracked node_modules entries are not allowed."
            echo "They make reusable GitHub Actions brittle and platform-specific."
            echo
            echo "${tracked}"
            exit 1
          fi

  action-pins:
    name: Actions pinned by SHA
    # Hard-pinned to GitHub-hosted runners (2026-09-23, coherence audit B-D04).
    # This repo is permanently public and this job runs on `pull_request`, so it
    # executes code from fork PRs; that code must never reach the private
    # self-hosted pool. Do not reintroduce the org-variable runner arm here.
    # Why: AGENTS.md "CI runners in a public repo".
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Action pin guard self-test
        run: bash ./scripts/tests/test-action-pins.sh

      - name: Assert every third-party `uses:` is SHA-pinned
        run: bash ./scripts/check-action-pins.sh
