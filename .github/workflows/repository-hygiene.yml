name: Repository Hygiene

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  no-tracked-node-modules:
    name: No tracked node_modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Reject tracked dependency installs
        shell: bash
        run: |
          set -euo pipefail

          tracked="$(git ls-files | grep -E '(^|/)node_modules/' || true)"

          if [[ -n "${tracked}" ]]; then
            echo "Tracked node_modules entries are not allowed."
            echo "They make reusable GitHub Actions brittle and platform-specific."
            echo
            echo "${tracked}"
            exit 1
          fi

  action-pins:
    name: Actions pinned by SHA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Action pin guard self-test
        run: bash ./scripts/tests/test-action-pins.sh

      - name: Assert every third-party `uses:` is SHA-pinned
        run: bash ./scripts/check-action-pins.sh
