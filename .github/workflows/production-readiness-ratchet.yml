name: Production Readiness Ratchet

on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/package.json'
      - 'scripts/check-production-readiness-ratchet.py'
      - '.github/workflows/production-readiness-ratchet.yml'
  push:
    branches: [main]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/package.json'
      - 'scripts/check-production-readiness-ratchet.py'
      - '.github/workflows/production-readiness-ratchet.yml'

permissions:
  contents: read

jobs:
  ratchet-baseline:
    # Hard-pinned to GitHub-hosted runners (2026-09-23, coherence audit B-D04).
    # This repo is permanently public and this job runs on `pull_request`, so it
    # executes code from fork PRs; that code must never reach the private
    # self-hosted pool. Do not reintroduce the org-variable runner arm here.
    # Why: AGENTS.md "CI runners in a public repo".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report production-readiness ratchet findings
        run: python3 scripts/check-production-readiness-ratchet.py --warn-only .
