name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package_path:
        description: Workspace package directory to publish
        required: true
        default: packages/ecosystem-banner
        type: string
      dry_run:
        description: Validate publish without uploading the package
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    # Runner arm, kept ONLY on this manually dispatched publish job (2026-09-23,
    # coherence audit B-D04): `workflow_dispatch` runs trusted `main` code, never
    # fork-PR code, so moving it to the self-hosted pool via the org variable
    # `ARC_BOOTSTRAP_COMPLETE` is acceptable. Every `pull_request` job in this
    # repo is hard-pinned to `ubuntu-latest`; see AGENTS.md "CI runners in a
    # public repo".
    runs-on: ${{ vars.ARC_BOOTSTRAP_COMPLETE == 'true' && 'madfam-runners-blue' || 'ubuntu-latest' }}
    env:
      PACKAGE_PATH: ${{ inputs.package_path }}
      DRY_RUN: ${{ inputs.dry_run }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate package path
        shell: bash
        run: |
          set -euo pipefail
          case "${PACKAGE_PATH}" in
            packages/*) ;;
            *)
              echo "::error::package_path must be under packages/"
              exit 1
              ;;
          esac
          test -f "${PACKAGE_PATH}/package.json"

      # One registry of record per package (owner ruling 2026-09-23, R38): the
      # package's own `publishConfig.registry` decides. `@madfam/core` publishes to
      # public npmjs; the rest of the set to the private npm.madfam.io. Anything
      # else is refused rather than guessed.
      - name: Resolve target registry from publishConfig
        id: target
        shell: bash
        run: |
          set -euo pipefail
          REG=$(node -p "(require('./${PACKAGE_PATH}/package.json').publishConfig || {}).registry || ''")
          case "${REG}" in
            https://registry.npmjs.org|https://registry.npmjs.org/)
              echo "registry=https://registry.npmjs.org/" >> "$GITHUB_OUTPUT"
              echo "access=public" >> "$GITHUB_OUTPUT" ;;
            https://npm.madfam.io|https://npm.madfam.io/)
              echo "registry=https://npm.madfam.io/" >> "$GITHUB_OUTPUT"
              echo "access=restricted" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::${PACKAGE_PATH}/package.json publishConfig.registry must be registry.npmjs.org or npm.madfam.io (got '${REG}')"
              exit 1 ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Enable pnpm
        run: corepack enable

      - name: Configure npm.madfam.io auth
        if: ${{ steps.target.outputs.registry == 'https://npm.madfam.io/' }}
        uses: ./.github/actions/npm-madfam-auth
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
        with:
          require-publish-capable: "true"

      - name: Configure registry.npmjs.org auth
        if: ${{ steps.target.outputs.registry == 'https://registry.npmjs.org/' }}
        shell: bash
        env:
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPMJS_TOKEN:-}" ]; then
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::warning::NPMJS_TOKEN is not set; continuing because this is a dry run"
              exit 0
            fi
            echo "::error::NPMJS_TOKEN is empty - an operator must provision the npmjs publish token before a real publish"
            exit 1
          fi
          printf '\n//registry.npmjs.org/:_authToken=%s\n' "${NPMJS_TOKEN}" >> .npmrc
          chmod 600 .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck package
        run: pnpm -C "${PACKAGE_PATH}" typecheck

      - name: Test package
        run: pnpm -C "${PACKAGE_PATH}" test

      - name: Build package
        run: pnpm -C "${PACKAGE_PATH}" build

      # `pnpm publish` (not `npm publish`) so `workspace:` dependency ranges are
      # rewritten to real versions in the published manifest.
      - name: Publish dry-run
        working-directory: ${{ inputs.package_path }}
        run: >-
          pnpm publish --dry-run --no-git-checks
          --access "${{ steps.target.outputs.access }}"
          --registry "${{ steps.target.outputs.registry }}"

      - name: Publish package
        if: ${{ inputs.dry_run == false }}
        working-directory: ${{ inputs.package_path }}
        run: >-
          pnpm publish --no-git-checks
          --access "${{ steps.target.outputs.access }}"
          --registry "${{ steps.target.outputs.registry }}"

      - name: Dry-run complete
        if: ${{ inputs.dry_run == true }}
        run: echo "Dry run completed; package was not published."
