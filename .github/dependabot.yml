version: 2

# ---------------------------------------------------------------------------
# THIS IS A SINGLE-LOCKFILE pnpm WORKSPACE.
#
# There is exactly one lockfile — `/pnpm-lock.yaml` — and it covers every
# workspace member listed in `pnpm-workspace.yaml` (`packages/*`, `apps/*`,
# `templates/*`).
#
# Therefore there must be exactly ONE npm update config, rooted at "/".
#
# Do NOT add per-directory configs (e.g. directory: "/packages/core"). Dependabot
# treats each such directory as an independent project: it finds only that
# directory's package.json, and — because no lockfile lives there — it updates
# the manifest and NEVER touches the root pnpm-lock.yaml. The resulting PR is
# born broken and can never go green, because every workflow begins with
# `pnpm install --frozen-lockfile`, which fails with ERR_PNPM_OUTDATED_LOCKFILE
# the moment a manifest and the lockfile disagree.
#
# A second consequence of per-directory configs: they do not inherit the
# `ignore` rules, so major bumps this repo has explicitly opted out of get
# raised anyway.
#
# (Comment carried over verbatim in substance from madfam-site's
# .github/dependabot.yml, which is a single-lockfile pnpm workspace with the
# same trap.)
# ---------------------------------------------------------------------------

updates:
  # npm — the entire pnpm workspace, from the root (the only lockfile).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions. Every `uses:` in this repository is pinned to a 40-hex SHA
  # (scripts/check-action-pins.sh enforces it), so this config is what keeps the
  # pins — and the `# vN.N.N` comment beside each one — from going stale.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"
